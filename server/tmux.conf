set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# Send tmux copies (mouse drag / copy mode) to your local clipboard via OSC 52
set -g set-clipboard on
set -as terminal-features ",*:clipboard"
# Let programs inside tmux (e.g. Claude Code) talk to your terminal directly
set -g allow-passthrough on
# @agentbox-names (messaging on), @agentbox-box and @agentbox-pool, from agentbox-name
# tmux-options (written on every sync).
source-file -q ~/.config/agentbox/tmux-options.conf
# Tab title: the agent's title for its conversation (Claude's /rename changes it), then the
# session. With messaging on, a session's name starts with its short name BOX/SESSION (any box
# of the pool, after a move), which the tab leaves out: it already ends with the session. A
# name that is only the short name shows as the session. (No regex built from the session's
# name: "+" in one is special. tmux 3.4 prints a group that didn't match as its digit, so
# the leading status mark is matched in its own branch.)
set -g set-titles on
set -g set-titles-string '#{?#{@agentbox-pool},#{?#{m/r:^([^ ]+ )?#{@agentbox-pool}(-[0-9]+)?/[^ ]+$,#{pane_title}},#{session_name},#{?#{m/r:^#{@agentbox-pool}(-[0-9]+)?/[^ ]+ · ,#{pane_title}},#{s|^#{@agentbox-pool}(-[0-9]+)?/[^ ]+ · ||:pane_title},#{s|^([^ ]+ )#{@agentbox-pool}(-[0-9]+)?/[^ ]+ · |\1|:pane_title}} · #{session_name}},#{pane_title} · #{session_name}}'
# A pane's title changes (Claude Code starts, or someone renames the session) and lacks the
# short name: agentbox-name puts it back in front (messaging on only; globs, not a regex, so
# "+" is literal; tmux 3.4 has no working negation). A fixed index, so re-reading this file
# doesn't add a second copy, and hooks of your own at [0] stay.
set-hook -g pane-title-changed[42] 'if -F "#{?#{@agentbox-names},#{?#{||:#{m:*#{@agentbox-box}/#{session_name} · *,#{pane_title}},#{m:*#{@agentbox-box}/#{session_name},#{pane_title}}},0,1},0}" "run-shell -b \"/usr/local/bin/agentbox-name keep #{q:session_name} #{q:pane_id} >/dev/null 2>&1 || true\""'
